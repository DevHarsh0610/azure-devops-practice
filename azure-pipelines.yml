# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  imageRepository: 'dockerharsh10/devops-practice-backend' # Update with your DockerHub/ACR username
  containerRegistry: 'dockerhub-service-principal' # The name from Step 1
  tag: '$(Build.BuildId)'

stages:
  - stage: CI_Validation
    displayName: 'CI & Code Quality Gate'

    jobs:
      - job: ValidateAndTest
        displayName: 'Validate and Test'

        steps:
          - task: UseNode@1
            inputs:
              version: '20.x'
            displayName: 'Set Nodejs version'

          - script: |
              node --version
              npm --version
            displayName: 'Check Nodejs and npm version'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npx prisma validate
            displayName: 'Validate prisma schema'
            env:
              DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

          - script: npm run lint
            displayName: 'Check code quality'

          - script: npm audit --audit-level=high
            displayName: 'Scan Dependencies for Vulnerabilities'
            continueOnError: true
          
          - script: npm run test:coverage
            displayName: 'Run unit tests'
          
          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results/junit.xml'
              failTaskOnFailedTests: true
            displayName: 'Publish Test Results'

          - script: npm run build
            displayName: 'Build the application'

          - script: ls -la dist
  - stage: Build_Artifact
    displayName:'Build and Push Docker Image'
    dependsOn: CI_Validation
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

    jobs:
      - job: BuildAndPush
        displayName: 'Build and push to container registry'

        steps:
        - task: Docker@2
          displayName: 'Build And Push Container'
          inputs:
            command: 'BuildAndPush'
            repository: '$(imageRepository)'
            dockerfile: '**/Dockerfile'
            containerRegistry: '$(containerRegistry)'
            tags: |
              $(tag)
              latest