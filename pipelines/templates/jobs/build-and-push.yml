# templates/jobs/build-and-push.yml
# ─────────────────────────────────────────────────────────────────────────────
# Job Template: Build and Push Docker Image
#
# PURPOSE:
#   Builds the Docker image from the Dockerfile and pushes it to the
#   configured container registry with both the build ID tag and 'latest'.
#
# HOW TO USE:
#   - template: templates/jobs/build-and-push.yml
#     parameters:
#       imageRepository: $(imageRepository)
#       containerRegistry: $(containerRegistry)
#       tag: $(tag)
#
# PARAMETERS:
#   imageRepository  → Full image name (e.g. dockerharsh10/devops-practice-backend)
#   containerRegistry → Service connection name for the container registry
#   tag              → Image tag (usually the Build.BuildId)
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: imageRepository
    type: string

  - name: containerRegistry
    type: string

  - name: tag
    type: string

jobs:
  - job: BuildAndPush
    displayName: 'Build and Push to Container Registry'

    steps:
      - task: Docker@2
        displayName: 'Login to Container Registry'
        inputs:
          command: 'login'
          containerRegistry: ${{ parameters.containerRegistry }}

      - script: |
          IMAGE="${{ parameters.imageRepository }}:${{ parameters.tag }}"
          echo "Checking if image $IMAGE already exists in registry..."
          export DOCKER_CLI_EXPERIMENTAL=enabled
          if docker manifest inspect $IMAGE > /dev/null 2>&1; then
            echo "Image $IMAGE exists. Skipping build."
            echo "##vso[task.setvariable variable=SkipDockerBuild;isOutput=true]true"
          else
            echo "Image $IMAGE does not exist. Proceeding with build."
            echo "##vso[task.setvariable variable=SkipDockerBuild;isOutput=true]false"
          fi
        name: CheckImage
        displayName: 'Check if image already exists'

      - task: Docker@2
        displayName: 'Build and Push Container Image'
        condition: ne(variables['CheckImage.SkipDockerBuild'], 'true')
        inputs:
          command: 'buildAndPush'
          repository: ${{ parameters.imageRepository }}
          dockerfile: '**/Dockerfile'
          containerRegistry: ${{ parameters.containerRegistry }}
          tags: |
            ${{ parameters.tag }}
            latest
