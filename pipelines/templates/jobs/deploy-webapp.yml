# templates/jobs/deploy-webapp.yml
# ─────────────────────────────────────────────────────────────────────────────
# Job Template: Deploy Azure Web App Container with optional Blue-Green slots
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: environment
    type: string

  - name: appName
    type: string

  - name: azureSubscription
    type: string

  - name: imageRepository
    type: string

  - name: tag
    type: string

  - name: vmImage
    type: string
    default: 'ubuntu-latest'

  - name: deployToSlot
    type: boolean
    default: false

  - name: resourceGroupName
    type: string
    default: ''

  - name: slotName
    type: string
    default: 'staging'

  - name: validateUrl
    type: string
    default: ''

jobs:
  - deployment: DeployWebApp
    displayName: 'Deploy to ${{ parameters.environment }}'
    environment: ${{ parameters.environment }}
    pool:
      vmImage: ${{ parameters.vmImage }}
    strategy:
      runOnce:
        deploy:
          steps:
            # ── Standard Deployment or Deploy to Slot ──────────────────────
            - task: AzureWebAppContainer@1
              displayName: 'Deploy Container to Azure Web App'
              inputs:
                azureSubscription: ${{ parameters.azureSubscription }}
                appName: ${{ parameters.appName }}
                containers: '${{ parameters.imageRepository }}:${{ parameters.tag }}'
                deployToSlotOrASE: ${{ parameters.deployToSlot }}
                ${{ if eq(parameters.deployToSlot, true) }}:
                  resourceGroupName: ${{ parameters.resourceGroupName }}
                  slotName: ${{ parameters.slotName }}

            # ── Deployment Validation (Smoke Test / Health Ping) ───────────
            - script: |
                echo "Initiating deployment validation for ${{ parameters.environment }}..."
                # Extract protocol and hostname for logging
                echo "Target URL: ${{ parameters.validateUrl }}"
                
                for i in {1..6}; do
                  echo "Attempt $i: Pinging health endpoint..."
                  STATUS=$(curl -s -o /dev/null -w "%{http_code}" -k "${{ parameters.validateUrl }}")
                  if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 302 ] || [ "$STATUS" -eq 201 ]; then
                    echo "Validation succeeded! HTTP Status code: $STATUS."
                    exit 0
                  fi
                  echo "Status code $STATUS. Retrying in 15 seconds..."
                  sleep 15
                done
                echo "Validation Failed: App did not respond with 200/302/201 within validation timeout."
                exit 1
              displayName: 'Verify App Deployment Health'
              condition: and(succeeded(), ne('${{ parameters.validateUrl }}', ''))

            # ── Zero-Downtime Swap (Staging -> Production) ─────────────────
            - task: AzureAppServiceManage@0
              displayName: 'Swap Blue/Green Slots'
              condition: and(succeeded(), eq(${{ parameters.deployToSlot }}, true))
              inputs:
                azureSubscription: ${{ parameters.azureSubscription }}
                Action: 'Swap Slots'
                WebAppName: ${{ parameters.appName }}
                ResourceGroupName: ${{ parameters.resourceGroupName }}
                SourceSlot: ${{ parameters.slotName }}
                TargetSlot: 'production'
