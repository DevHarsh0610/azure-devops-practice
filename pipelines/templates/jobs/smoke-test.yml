# templates/jobs/smoke-test.yml
# ─────────────────────────────────────────────────────────────────────────────
# Job Template: Smoke Test
#
# PURPOSE:
#   Verifies that a deployed Azure App Service is alive and healthy by calling
#   the application's /health endpoint. Runs immediately after a deployment job
#   in the same stage.
#
#   Three checks are performed in sequence:
#     1. Basic liveness   → GET /health           (server is responding)
#     2. App statistics   → GET /health/application (process info is returned)
#
#   Each check retries up to 5 times with a 30-second back-off to allow
#   Azure App Service cold-start / container pull time.
#
# HOW TO USE:
#   In a deploy stage, add this as a second job after the deploy template:
#
#     jobs:
#       - template: templates/jobs/deploy-webapp.yml
#         parameters:
#           environment: 'development'
#           appName: 'my-app'
#           ...
#       - template: templates/jobs/smoke-test.yml
#         parameters:
#           appName: 'my-app'
#           environment: 'development'
#           dependsOnJob: 'DeployWebApp'
#
# PARAMETERS:
#   appName        → Azure App Service name (used to build the URL)
#   environment    → Display label for the environment being tested
#   dependsOnJob   → Name of the deployment job this test waits for (default: DeployWebApp)
#   retries        → Number of retry attempts per health check (default: 5)
#   retryDelaySecs → Seconds to wait between retries (default: 30)
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: appName
    type: string

  - name: environment
    type: string

  - name: dependsOnJob
    type: string
    default: 'DeployWebApp'

  - name: retries
    type: number
    default: 5

  - name: retryDelaySecs
    type: number
    default: 30

jobs:
  - job: SmokeTest_${{ replace(parameters.environment, '-', '_') }}
    displayName: 'Smoke Test — ${{ parameters.environment }}'
    dependsOn: ${{ parameters.dependsOnJob }}
    condition: succeeded()

    steps:
      - script: |
          BASE_URL="https://${{ parameters.appName }}.azurewebsites.net"
          RETRIES=${{ parameters.retries }}
          DELAY=${{ parameters.retryDelaySecs }}

          run_check() {
            local LABEL="$1"
            local ENDPOINT="$2"
            local URL="${BASE_URL}${ENDPOINT}"
            local ATTEMPT=1

            echo "──────────────────────────────────────────"
            echo "  Check : ${LABEL}"
            echo "  URL   : ${URL}"
            echo "──────────────────────────────────────────"

            while [ $ATTEMPT -le $RETRIES ]; do
              echo "[Attempt ${ATTEMPT}/${RETRIES}] Calling ${URL}..."

              HTTP_STATUS=$(curl --silent --output /tmp/smoke_response.json \
                                 --write-out "%{http_code}" \
                                 --max-time 15 \
                                 "${URL}")

              echo "  HTTP status : ${HTTP_STATUS}"
              echo "  Response    : $(cat /tmp/smoke_response.json)"

              if [ "$HTTP_STATUS" -eq 200 ]; then
                echo "✅ PASSED — ${LABEL}"
                return 0
              fi

              echo "⚠️  Got HTTP ${HTTP_STATUS}, retrying in ${DELAY}s..."
              sleep $DELAY
              ATTEMPT=$((ATTEMPT + 1))
            done

            echo "❌ FAILED — ${LABEL} did not return HTTP 200 after ${RETRIES} attempts."
            return 1
          }

          # ── Check 1: Basic liveness ──────────────────────────────────────
          run_check "Liveness (/health)" "/health" || exit 1

          # ── Check 2: Application statistics ─────────────────────────────
          run_check "App stats (/health/application)" "/health/application" || exit 1

          echo ""
          echo "════════════════════════════════════════════"
          echo "  ✅ All smoke tests passed for: ${{ parameters.environment }}"
          echo "════════════════════════════════════════════"
        displayName: 'Run health checks on ${{ parameters.environment }}'
