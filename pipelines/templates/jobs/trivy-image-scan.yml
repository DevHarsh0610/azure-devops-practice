# pipelines/templates/jobs/trivy-image-scan.yml
# ─────────────────────────────────────────────────────────────────────────────
# Job Template: Trivy Image Scan
#
# PURPOSE:
#   Downloads and installs Trivy (if not present) and performs a vulnerability
#   scan on the built container image, failing on CRITICAL issues.
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: imageRepository
    type: string
  - name: tag
    type: string
  - name: severity
    type: string
    default: 'CRITICAL'
  - name: containerRegistry
    type: string

jobs:
  - job: TrivyImageScan
    displayName: 'Trivy Docker Image Vulnerability Scan'
    steps:
      - task: Docker@2
        displayName: 'Login to Container Registry'
        inputs:
          command: 'login'
          containerRegistry: ${{ parameters.containerRegistry }}

      - script: |
          set -e
          mkdir -p $(Agent.TempDirectory)/trivy-bin
          export PATH=$(Agent.TempDirectory)/trivy-bin:$PATH

          if ! command -v trivy &> /dev/null; then
            echo "Installing Trivy to Agent Temp Directory..."
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b $(Agent.TempDirectory)/trivy-bin
          fi

          echo "Pulling image ${{ parameters.imageRepository }}:${{ parameters.tag }}..."
          docker pull ${{ parameters.imageRepository }}:${{ parameters.tag }}

          echo "Running Trivy Image Scan on ${{ parameters.imageRepository }}:${{ parameters.tag }} for ${{ parameters.severity }} vulnerabilities..."
          trivy image --severity ${{ parameters.severity }} --exit-code 1 ${{ parameters.imageRepository }}:${{ parameters.tag }}
        displayName: 'Install and Run Trivy Image Scan'
