# templates/jobs/validate-and-test.yml
# ─────────────────────────────────────────────────────────────────────────────
# Job Template: Validate and Test
#
# PURPOSE:
#   Runs all CI checks — Node.js setup, dependency install, schema validation,
#   linting, security audit, unit tests, and the TypeScript build.
#
# HOW TO USE:
#   - job: ValidateAndTest
#     template: templates/jobs/validate-and-test.yml
#
# PARAMETERS:
#   nodeVersion  → The Node.js version to use (default: '20.x')
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: nodeVersion
    type: string
    default: '24.x'

jobs:
  - job: ValidateAndTest
    displayName: 'Validate and Test'

    steps:
      - task: UseNode@1
        inputs:
          version: ${{ parameters.nodeVersion }}
        displayName: 'Set Node.js LTS version'

      - script: echo "##vso[task.setvariable variable=npm_config_cache]$(Pipeline.Workspace)/.npm"
        displayName: 'Set npm cache path'

      - task: Cache@2
        inputs:
          key: 'npm | "$(Agent.OS)" | backend/package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(npm_config_cache)
        displayName: 'Cache npm dependencies'

      - script: npm ci
        workingDirectory: backend
        displayName: 'Install dependencies'

      - script: npm run lint
        workingDirectory: backend
        displayName: 'Check code quality'

      - script: npm audit --audit-level=high
        workingDirectory: backend
        displayName: 'Scan dependencies for vulnerabilities'
        continueOnError: true

      - script: npm run test:coverage
        workingDirectory: backend
        displayName: 'Run unit tests'

      - task: PublishTestResults@2
        condition: always()
        inputs:
          testResultsFormat: 'JUnit'
          testResultsFiles: 'test-results/junit.xml'
          failTaskOnFailedTests: true
        displayName: 'Publish Test Results'

      - script: npm run build
        workingDirectory: backend
        displayName: 'Build the application'

      - script: ls -la dist
        workingDirectory: backend
        displayName: 'Verify build output'
